# incompetech catalog — HTTP-only vhost for incompetech.lab980.com.
#
# This is the FALLBACK vhost: `incompetech setup` installs it as
# /etc/nginx/sites-available/incompetech.lab980.com only when lab980's
# `provision-site` is not on PATH (which normally writes the vhost, with the
# shared security-headers include, and runs certbot).
#
# A plain proxy, and deliberately nothing more. Every response this app gives
# is a small JSON document or a static file; there is no streaming endpoint,
# no upload and no long-lived connection, so none of the buffering, timeout or
# gzip tuning a streaming site needs belongs here — and nothing in this file
# is managed or rewritten after it is installed.
#
# HTTP only on purpose: point DNS at the box, then
# `certbot --nginx -d incompetech.lab980.com --redirect` adds the 443 block
# and the redirect. Do not hand-write SSL blocks here.

server {
    listen 80;
    listen [::]:80;
    server_name incompetech.lab980.com;

    access_log /var/log/nginx/incompetech.access.log;
    error_log  /var/log/nginx/incompetech.error.log;

    # Nothing is uploaded here; the API is read-only.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8072;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # certbot drops its ACME challenge here when you run it later.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
